name: Build Opened Again Release

# Builds a signed release AAB for Opened Again using the production upload
# key, stored only as GitHub Actions secrets (never committed). Run
# manually whenever a signed AAB is needed for a Play Console upload.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   OPENEDAGAIN_KEYSTORE_B64      base64 of the upload keystore (.jks) file
#   OPENEDAGAIN_STORE_PASSWORD    store password
#   OPENEDAGAIN_KEY_ALIAS         key alias inside the keystore
#   OPENEDAGAIN_KEY_PASSWORD      key password (usually same as store password)
#
# Renamed from the generic ANDROID_* prefix -- director flagged that this
# is a monorepo with another Android app ("Hello, Today") also needing its
# own signing secrets in the same repo's Settings, and a bare "ANDROID_"
# prefix reads as if it could apply to either app.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        working-directory: opened-again-android
        env:
          KEYSTORE_B64: ${{ secrets.OPENEDAGAIN_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OPENEDAGAIN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPENEDAGAIN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPENEDAGAIN_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::OPENEDAGAIN_KEYSTORE_B64 secret is not set. Add it under Settings > Secrets and variables > Actions before running this workflow." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release-keystore.jks
          cat > keystore.properties <<PROPS
          storeFile=$(pwd)/release-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: gradle :core:test :app:bundleRelease
        working-directory: opened-again-android
        run: gradle :core:test :app:bundleRelease

      - name: Clean up keystore material
        if: always()
        working-directory: opened-again-android
        run: rm -f release-keystore.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: opened-again-release-aab
          path: opened-again-android/app/build/outputs/bundle/release/*.aab
