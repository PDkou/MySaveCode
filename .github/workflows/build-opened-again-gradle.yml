name: Build Opened Again Debug

# Debug-build validation for opened-again-android/ (core Kotlin tests +
# debug AAB). This is the "does it actually compile" check — the sandbox
# this app was developed in has no Android SDK/Gradle dependency access,
# so this workflow is the only place a real build has run.
#
# v0.90: switched from auto-triggering on every push (producing a debug
# APK) to manual-only, matching the sibling Hello Today app's own
# build-hellotoday-gradle.yml convention (workflow_dispatch + optional
# ref input) at director's request -- director no longer wants APK
# artifacts at all, only ever an AAB (debug here, signed release from
# build-opened-again-release.yml for anything actually installed/tested).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to build (defaults to the ref the workflow runs from)"
        required: false
        type: string

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: gradle :core:test :app:bundleDebug
        working-directory: opened-again-android
        run: gradle :core:test :app:bundleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: opened-again-debug-aab
          path: opened-again-android/app/build/outputs/bundle/debug/*.aab
