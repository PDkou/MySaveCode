name: fetch-android-sdk-tools

# One-off utility workflow: packages the Android SDK pieces hellotoday-app
# needs (build-tools 35.0.1/36.0.0 + platforms android-35/android-36) from a
# GitHub-hosted runner -- which can reach dl.google.com -- and publishes
# them as a repo Release asset, the same way the Godot binary used by
# game/ was made available (see the "godot-tool" release).
#
# platform 36 was added 2026-08-27: Google Play requires new apps/updates to
# target API 36 from August 31, 2026 (see
# https://developer.android.com/google/play/requirements/target-sdk), so
# hellotoday-app compiles against it now. 35 stays for anything still
# pinned to it.
#
# The CCR sandbox that normally does this work has dl.google.com blocked by
# its egress policy, so it can't run `sdkmanager` itself; it can only fetch
# the result from a GitHub Release afterwards. Run this manually
# (workflow_dispatch) whenever that slim SDK bundle needs to be
# (re)published.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Locate SDK, install missing pieces if needed
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | head -n1)"
          COMPONENTS=("build-tools;35.0.1" "build-tools;36.0.0" "platforms;android-35" "platforms;android-36")
          MISSING=()
          for c in "${COMPONENTS[@]}"; do
            p="$SDK/${c/;//}"
            [ -e "$p" ] || MISSING+=("$c")
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "Installing missing components: ${MISSING[*]}"
            yes | "$SDKMANAGER" --sdk_root="$SDK" "${MISSING[@]}" > /dev/null
          fi
          mkdir -p "$RUNNER_TEMP/android-sdk/build-tools" "$RUNNER_TEMP/android-sdk/platforms"
          for c in "${COMPONENTS[@]}"; do
            p="$SDK/${c/;//}"
            cp -r "$p" "$RUNNER_TEMP/android-sdk/${c/;//}"
          done
          (cd "$RUNNER_TEMP" && zip -qr android-sdk-slim.zip android-sdk)
          mv "$RUNNER_TEMP/android-sdk-slim.zip" .
          ls -lh android-sdk-slim.zip

      - name: Publish (or replace) the release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="android-sdk-slim"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" -y
          fi
          gh release create "$TAG" android-sdk-slim.zip \
            --repo "$REPO" \
            --title "Android SDK slim (build-tools 35.0.1/36.0.0 + platforms 35/36)" \
            --notes "For hellotoday-app. Contains only build-tools/{35.0.1,36.0.0}/ and platforms/{android-35,android-36}/ (not a full SDK). Regenerate via the fetch-android-sdk-tools workflow if it goes stale."
