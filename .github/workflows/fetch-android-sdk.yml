name: fetch-android-sdk-tools

# One-off utility workflow: packages the Android SDK pieces
# hellotoday-app/build.sh needs (build-tools;35.0.1 + platforms;android-35)
# from a GitHub-hosted runner -- which can reach dl.google.com -- and
# publishes them as a repo Release asset, the same way the Godot binary
# used by game/ was made available (see the "godot-tool" release).
#
# The CCR sandbox that normally does this work has dl.google.com blocked by
# its egress policy, so it can't run `sdkmanager` itself; it can only fetch
# the result from a GitHub Release afterwards. Run this manually
# (workflow_dispatch) whenever that slim SDK bundle needs to be
# (re)published.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Locate SDK, install missing pieces if needed
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | head -n1)"
          if [ ! -d "$SDK/build-tools/35.0.1" ] || [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            echo "Installing missing components via sdkmanager..."
            yes | "$SDKMANAGER" --sdk_root="$SDK" "build-tools;35.0.1" "platforms;android-35" > /dev/null
          fi
          mkdir -p "$RUNNER_TEMP/android-sdk/build-tools" "$RUNNER_TEMP/android-sdk/platforms"
          cp -r "$SDK/build-tools/35.0.1" "$RUNNER_TEMP/android-sdk/build-tools/"
          cp -r "$SDK/platforms/android-35" "$RUNNER_TEMP/android-sdk/platforms/"
          (cd "$RUNNER_TEMP" && zip -qr android-sdk-slim.zip android-sdk)
          mv "$RUNNER_TEMP/android-sdk-slim.zip" .
          ls -lh android-sdk-slim.zip

      - name: Publish (or replace) the release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="android-sdk-slim"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" -y
          fi
          gh release create "$TAG" android-sdk-slim.zip \
            --repo "$REPO" \
            --title "Android SDK slim (build-tools 35.0.1 + platform 35)" \
            --notes "For hellotoday-app/build.sh. Contains only build-tools/35.0.1/ and platforms/android-35/ (not a full SDK). Regenerate via the fetch-android-sdk-tools workflow if it goes stale."
