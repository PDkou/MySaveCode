name: build-hellotoday-release

# Builds a REAL, Play-Store-signed release AAB for Hello, Today using the
# production upload key, stored only as GitHub Actions secrets (never
# committed to the repo). Run manually (workflow_dispatch) whenever a new
# signed AAB is needed for a Play Console upload.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   HELLOTODAY_KEYSTORE_BASE64   base64 of the upload keystore (.jks) file
#   HELLOTODAY_KEYSTORE_PASSWORD store password
#   HELLOTODAY_KEY_ALIAS         key alias inside the keystore
#   HELLOTODAY_KEY_PASSWORD      key password (usually same as store password)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to build (defaults to the ref the workflow runs from)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Reconstruct signing keystore from secret
        working-directory: hellotoday-app
        env:
          KEYSTORE_BASE64: ${{ secrets.HELLOTODAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::HELLOTODAY_KEYSTORE_BASE64 secret is not set. Add it under Settings > Secrets and variables > Actions before running this workflow." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > hellotoday-upload-key.jks

      - name: Write keystore.properties
        working-directory: hellotoday-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.HELLOTODAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HELLOTODAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HELLOTODAY_KEY_PASSWORD }}
        run: |
          # storeFile must be an absolute path: build.gradle.kts resolves it
          # via file(...) from the app module directory (hellotoday-app/app),
          # not from keystore.properties' own directory (hellotoday-app/).
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/hellotoday-upload-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: gradlew bundleRelease
        working-directory: hellotoday-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Clean up keystore material
        if: always()
        working-directory: hellotoday-app
        run: rm -f hellotoday-upload-key.jks keystore.properties

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: hellotoday-release-aab
          path: hellotoday-app/app/build/outputs/bundle/release/*.aab
