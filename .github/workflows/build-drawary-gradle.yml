name: build-drawary-gradle

# Verifies drawary-app/ actually compiles. Mirrors
# build-hellotoday-gradle.yml (HelloToday branch) for the same reason: the
# CCR sandbox that authors this project has dl.google.com blocked, so it
# can write the Gradle files correctly but can't resolve the Android
# Gradle Plugin itself (or any Maven dependency) to prove they work. This
# runs on a GitHub-hosted runner (unrestricted network) and does that
# proof. Normally run manually (workflow_dispatch) after touching
# drawary-app's Gradle setup, or after rebuilding category-data-app/dist
# and re-copying it into drawary-app/app/src/main/assets/dist/ -- but
# workflow_dispatch only becomes dispatchable once this file exists on the
# repo's default branch (a GitHub restriction, unrelated to this repo's
# own setup), which isn't true yet for a workflow that was just added on a
# feature branch. The push trigger below is the one-time bootstrap around
# that: remove it (or narrow the branches: list) once this has merged and
# workflow_dispatch is usable directly, the same way build-hellotoday-gradle.yml
# already is on the HelloToday branch.
on:
  push:
    branches:
      - claude/category-data-management-app-jo6f6i
    paths:
      - "drawary-app/**"
      - ".github/workflows/build-drawary-gradle.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to build (defaults to the ref the workflow runs from)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: gradlew assembleDebug bundleDebug
        working-directory: drawary-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleDebug

      - name: Upload built debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drawary-debug-apk
          path: drawary-app/app/build/outputs/apk/debug/*.apk

      - name: Upload built debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: drawary-debug-aab
          path: drawary-app/app/build/outputs/bundle/debug/*.aab
