<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Drawary · 47 백업 진행</title>
  <style>
    :root { font-family: 'NanumSquare', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #235a9d; background: #fdf8f1; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { overflow: hidden; }
    .app {
      position: relative;
      margin: 0 auto;
      width: min(100%, 430px);
      height: 100dvh;
      min-height: 440px;
      overflow: hidden;
      background: radial-gradient(ellipse 110% 66% at 50% 46%, #fffdfa 0%, #fcf6ec 100%);
    }
    .toolbar {
      position: absolute;
      z-index: 1;
      top: env(safe-area-inset-top, 0px);
      width: 100%; height: 81px;
      display: flex; align-items: center; justify-content: center;
    }
    .toolbar h1 { margin: 0; color: #215c9e; font-size: 22px; letter-spacing: -0.9px; font-weight: 800; }
    .back {
      position: absolute; top: 30px; left: 17px;
      width: 34px; height: 34px; background: transparent; border: none;
      cursor: pointer; display: grid; place-items: center; padding: 0;
    }
    .back::after {
      display: block; content: ''; width: 14px; height: 14px;
      border-left: 3px solid #8e5af5; border-bottom: 3px solid #8e5af5;
      transform: translateX(4px) rotate(45deg);
    }
    .back:focus-visible { border-radius: 5px; outline: 2px solid #8e5af5; outline-offset: 2px; }
    .panel {
      position: absolute; top: calc(83px + env(safe-area-inset-top, 0px));
      left: 16px; right: 16px; bottom: calc(51px + env(safe-area-inset-bottom, 0px));
      border-radius: 20px;
      background: #fff;
      border: 1px solid rgba(224, 221, 220, 0.8);
      box-shadow: 0 2px 13px rgba(69, 57, 72, 0.045);
    }
    .illustration {
      position: absolute; top: calc(50% - 195px);
      left: 50%; width: min(67vw, 260px);
      aspect-ratio: 570 / 434;
      transform: translateX(-50%);
      object-fit: contain;
      user-select: none; pointer-events: none;
    }
    .loading-ring {
      position: absolute; top: calc(50% + 29px); left: calc(50% - 25px);
      width: 50px; height: 50px;
      animation: ring-rotate 1.25s linear infinite;
    }
    @keyframes ring-rotate { to { transform: rotate(360deg); } }
    .copy { position: absolute; top: calc(50% + 104px); left: 6px; right: 6px; text-align: center; }
    .copy h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.9px; margin: 0 0 14px; line-height: 1.45; color: #225996; }
    .copy p { margin: 0; font-size: 15.4px; letter-spacing: -0.6px; font-weight: 500; line-height: 1.55; color: #9991b0; }
    .copy p + p { margin-top: 3px; font-size: 14px; white-space: nowrap; }
    @media (max-height: 680px) {
      .panel { top: 75px; bottom: 18px; }
      .illustration { top: calc(50% - 173px); width: min(65vw, 218px); }
      .loading-ring { top: calc(50% + 25px); }
      .copy { top: calc(50% + 83px); }
      .copy h2 { font-size: 19px; margin-bottom: 7px; }
      .copy p { font-size: 13px; }
      .copy p + p { font-size: 12px; white-space: normal; }
    }
    @media (prefers-reduced-motion: reduce) { .loading-ring { animation: none; } }
  </style>
</head>
<body>
<main class="app">
  <header class="toolbar">
    <button type="button" class="back" aria-label="뒤로 가기" onclick="window.dispatchEvent(new CustomEvent('drawary:back'))"></button>
    <h1>백업하기</h1>
  </header>
  <section class="panel" aria-label="백업 진행 상태">
    <img class="illustration" src="assets/approved_character_cutout.png" alt="노란 폴더를 든 Drawary 마스코트" />
    <svg class="loading-ring" viewBox="0 0 50 50" role="status" aria-label="백업 진행 중">
      <circle cx="25" cy="25" r="20" fill="none" stroke="#e5dcfb" stroke-width="7" />
      <circle cx="25" cy="25" r="20" fill="none" stroke="#9260f3" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="24 126" transform="rotate(-125 25 25)" />
    </svg>
    <div class="copy" aria-live="polite">
      <h2>백업하고 있어요</h2>
      <p>잠시만 기다려주세요.</p>
      <p>데이터를 안전하게 정리하고 있습니다.</p>
    </div>
  </section>
</main>
</body>
</html>
