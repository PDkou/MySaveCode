<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawary 내부 테스트 체크리스트</title>
<style>
  :root { --bg:#faf8f3; --card:#fff; --ink:#2b2740; --sub:#6d6884; --line:#e6e1f0; --accent:#6a5bb0; --ok:#3f8f6b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16141f; --card:#201d2d; --ink:#ece9f6; --sub:#a29cb8; --line:#332f45; --accent:#a99bf0; --ok:#6cc79c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 80px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  .sub { color:var(--sub); font-size:14px; margin:0 0 16px; }
  .bar { position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:2; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .bar .row { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--sub); }
  .track { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:6px; }
  .fill { height:100%; width:0; background:var(--ok); transition:width .2s; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 16px 12px; margin-bottom:16px; }
  h2 { font-size:17px; margin:14px 0 4px; }
  p.note { color:var(--sub); font-size:14px; margin:0 0 6px; }
  label { display:flex; gap:12px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line); cursor:pointer; }
  label:first-of-type { border-top:0; }
  input[type=checkbox] { width:22px; height:22px; margin-top:2px; flex:none; accent-color:var(--accent); }
  input:checked + span { color:var(--sub); text-decoration:line-through; }
  button { font:inherit; font-size:14px; color:var(--accent); background:none; border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Drawary 내부 테스트 체크리스트</h1>
  <p class="sub">버전 0.1.2 ~ 0.1.4 테스트용이에요. 체크한 내용은 이 기기의 브라우저에 저장돼요. 다른 기기와는 공유되지 않아요.</p>

  <div class="bar">
    <div class="row"><span id="count">0 / 0</span><button id="reset" type="button">전부 해제</button></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <div id="list"></div>
</main>

    ["j27", "태블릿 가로: 앱 잠금 상세, PIN 설정, 백업, 복원, 데이터 초기화 화면이 가운데 창(시트)으로 열리고, 바깥을 누르면 닫혀요 (백업, 복원 진행 중에는 닫히지 않아요)"],
    ["j28", "태블릿 가로: 자주 묻는 질문, 사용 가이드가 넓은 화면에 맞게 보여요 (가이드는 카드 2열)"]
  ]},
  { title: "E. 문제가 생기면", items: [
    ["e1", "\"상품을 찾을 수 없음\"이면 상품이 활성인지, 같은 계정인지 확인했어요 (등록 후 반영에 몇 시간 걸릴 수 있어요)"],
    ["e2", "문제가 생긴 화면과 문구를 캡처해서 개발 대화에 보냈어요"],
    ["e3", "고친 뒤에는 버전 번호를 올려서 다시 올려야 한다는 것을 알아요"]
  ]}
];

const KEY = "drawary_internal_test_checklist_v1";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { saved = {}; }

const list = document.getElementById("list");
const boxes = [];

GROUPS.forEach(g => {
  const sec = document.createElement("section");
  const h = document.createElement("h2");
  h.textContent = g.title;
  sec.appendChild(h);
  if (g.note) {
    const p = document.createElement("p");
    p.className = "note";
    p.textContent = g.note;
    sec.appendChild(p);
  }
  g.items.forEach(([id, text, dflt]) => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.dataset.id = id;
    input.checked = id in saved ? !!saved[id] : !!dflt;
    const span = document.createElement("span");
    span.textContent = text;
    label.append(input, span);
    sec.appendChild(label);
    boxes.push(input);
    input.addEventListener("change", () => { save(); update(); });
  });
  list.appendChild(sec);
});

function save() {
  const out = {};
  boxes.forEach(b => { out[b.dataset.id] = b.checked; });
  try { localStorage.setItem(KEY, JSON.stringify(out)); } catch (e) {}
}
function update() {
  const done = boxes.filter(b => b.checked).length;
  document.getElementById("count").textContent = done + " / " + boxes.length + " 완료";
  document.getElementById("fill").style.width = (boxes.length ? done / boxes.length * 100 : 0) + "%";
}
document.getElementById("reset").addEventListener("click", () => {
  boxes.forEach(b => { b.checked = false; });
  save(); update();
});
update();
</script>
