<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Do Hyeon: a Woowahan Brothers (배달의민족) display face, used
         sparingly for headline moments only (screen titles, the home
         hero number, the splash title) -- everywhere else keeps the
         system font stack for density/legibility. The system stack
         alone read as "unstyled default UI" rather than a designed app;
         this is the single highest-impact fix for that without touching
         the already-locked-in icon/splash color assets. See global.css's
         --font-display. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#6F5499" />
    <meta name="description" content="나만의 카테고리를 만들고 항목을 기록하는 개인 데이터 관리 앱 (Drawary)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="나만의 서랍장" />
    <title>나만의 서랍장 · Drawary</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
