<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>또 열었네?</title>
<style>
:root{
  --bg:#F7F1E7;--paper:#FFFEFB;--ink:#2F2A27;--muted:#6B5F54;--brown:#9C7A5D;
  /* v0.38: director feedback -- "가독성을 높이도록". --muted (used for every
     secondary/label line across the app -- stat labels, detail text, case
     ids, settings subtext) measured 3.36:1 contrast against --bg (and
     3.7-3.8:1 against the white card/row backgrounds), below WCAG AA's
     4.5:1 minimum for normal-size text. Darkened to keep the same warm
     brown-gray hue while clearing AA on every background it's actually
     used against (5.5:1+ measured against --bg/white/paper). */
  --normal:#D9D9D9;--rare:#70BFFF;--epic:#A86CFF;--legend:#FFD166;--hidden:#082B3B;
  --radius:24px;--shadow:0 12px 34px rgba(80,62,48,.11);--line:#E9DED1;
  /* v0.36: director feedback -- buttons across the app felt inconsistent/
     uncomfortable to tap (the back button called out specifically). They'd
     accreted separate one-off radius (13/14/16px) and padding values with
     no shared system, and several (icon-btn, lang, share, sheet-close) sat
     under Android's ~48dp recommended minimum touch target. One shared
     radius + min-height for every tappable button from here on. */
  --btn-radius:16px;--btn-min:46px
}
/* v0.38: director feedback -- tapping an archive card (or any other
   clickable row) left a lingering blue highlight overlay after the tap,
   sometimes not fading until a later interaction. That's WebView's default
   `-webkit-tap-highlight-color`; disabling it app-wide (every element still
   gets its own `:active` feedback where one is defined, e.g. `.share:active`) */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Noto Sans JP",sans-serif;overscroll-behavior:none}
body{background:radial-gradient(circle at 12% 4%,#fff9f1 0 14%,transparent 30%),var(--bg)}button{font:inherit}
/* v0.49: director feedback -- "여백이 이상함(좌우 여백, 카드/버튼 사이
   간격)", referencing well-known Korean apps' proportions. 18px/14px side
   margins were on the tight end of what apps like 카카오톡(16px)/
   토스(~20px)/당근마켓(16px) actually use -- bumped both toward that
   range rather than picking an outlier. See the matching @media block
   below for the narrow-screen side. */
.app{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(90px + env(safe-area-inset-bottom))}
/* v0.24: onboarding (see onboardScreen()/render() below). The two
   onboarding images are full-screen 941x1672 compositions with their own
   baked-in buttons -- per design's own handoff note, these are visual
   comps only; real tap targets are transparent buttons laid over them in
   code, positioned as % of the image's own box so they track the art
   exactly regardless of device aspect ratio. `.app.onboard` drops the
   normal page padding so the art can go edge-to-edge. */
.app.onboard{padding:0;max-width:none}
.onboard-frame{position:fixed;inset:0;overflow:hidden;background:#F7F1E7;z-index:20}
/* v0.36: was sized by height:100% alone -- fine on screens shaped like the
   941:1672 source image, but any device narrower/taller than that ratio
   (nearly every modern Android phone: e.g. a 393x851 screen is ~0.46 vs the
   image's ~0.56) forced the box wider than the viewport and .onboard-frame's
   overflow:hidden clipped both sides, cutting off real content (side
   decorations, the page-count dots). min()-based "contain" sizing picks
   whichever of width/height is the binding constraint on THIS screen, so
   the full image always fits with no cropping (only letterboxing on the
   other axis, never overflow) -- verified against both a narrow/tall phone
   and a squarer one. Hit-box % coordinates below still line up since the
   box's rendered aspect ratio never changes, only its absolute size. */
.onboard-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);aspect-ratio:941/1672;width:min(100vw,100vh * 941 / 1672);height:min(100vh,100vw * 1672 / 941)}
.onboard-box img{display:block;width:100%;height:100%}
.onboard-hit{position:absolute;border:0;background:transparent;padding:0;-webkit-tap-highlight-color:transparent}
.brand{display:flex;align-items:center;gap:13px}.avatar{width:68px;height:68px;border-radius:22px;object-fit:cover;border:2px solid #E7D9C8;background:#DCEAFF;box-shadow:0 5px 18px rgba(80,60,40,.08)}
.brand-main{flex:1}.brand h1{font-size:30px;margin:0;letter-spacing:-1.8px;line-height:1}.brand .sub{font-size:13px;color:var(--muted);margin-top:7px}.date{font-size:12px;color:var(--muted);margin:12px 2px 0}
.permission,.empty{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-top:22px;box-shadow:var(--shadow)}.permission h2{margin:0 0 8px}.permission p{font-size:14px;line-height:1.6;color:var(--muted)}
.primary{border:0;border-radius:var(--btn-radius);min-height:calc(var(--btn-min) + 4px);padding:0 18px;background:#6758F5;color:white;font-weight:900;width:100%;margin-top:14px;box-shadow:0 8px 18px rgba(103,88,245,.2);display:flex;align-items:center;justify-content:center}
/* v0.35: tab bar moved to the bottom of the screen (icon+label, 4 items)
   to match art/reference/target-visual-direction's mockups -- it had been
   sitting at the TOP as 3 plain text buttons, a real layout mismatch with
   the approved mockup that went unnoticed until the director asked about
   it directly. Uses the unlabeled icon set (docs/UI_VISUAL_DIRECTION_
   REQUEST.md item 5, delivered 2026-09-09, never wired up before now) plus
   a live text label so active/inactive styling and language switching both
   work without needing per-language image variants. */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,251,246,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.tabbtn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:var(--btn-radius);color:#9A8E83;min-height:var(--btn-min)}
.tabbtn img{width:23px;height:23px;object-fit:contain;opacity:.5}
.tabbtn span{font-size:11px;font-weight:800}
.tabbtn.active{background:#F3EBDE;color:#332C28}
.tabbtn.active img{opacity:1}
.hero{margin-top:17px;background:linear-gradient(135deg,#FFF9F0 0%,#EFE1CE 100%);border:1px solid #EADAC5;border-radius:27px;padding:17px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;min-height:124px;position:relative}.hero:after{content:"";position:absolute;right:120px;bottom:-32px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.42)}.hero img{width:132px;height:96px;object-fit:cover;object-position:50% 10%;border-radius:19px;position:relative;z-index:1}.hero h2{margin:0;font-size:21px;letter-spacing:-.8px}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.55;max-width:310px}
/* v0.49: director feedback -- "홈화면에 사용한 시간의 비율이 이상함."
   4 equal-width columns worked for opens/unlocks/cases (1-2 digit
   numbers) but the usage-time cell's actual content (`fmtMs()`, e.g.
   "2시간 23분") is 3-4x longer and wrapped to 2 lines while its siblings
   stayed on 1 -- the one cell visibly taller/off-balance from the rest of
   the row. Widened that column's share instead of keeping 4 even
   fractions, verified against real fmtMs() output at common Korean phone
   widths (360-412px) until it stays on one line. */
.daily-strip{display:grid;grid-template-columns:0.85fr 1.5fr 0.85fr 0.7fr;gap:8px;margin-top:11px}.mini-stat{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:15px;padding:10px 6px;text-align:center}.mini-stat b{display:block;font-size:17px;white-space:nowrap}.mini-stat span{font-size:11px;color:var(--muted)}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 10px}.section-title h2{margin:0;font-size:20px;letter-spacing:-.7px}.count{font-size:12px;color:var(--muted)}
.card{position:relative;border-radius:28px;padding:0;margin:13px 0;background:#fff;border:2px solid var(--border);box-shadow:var(--shadow);overflow:hidden;isolation:isolate}.card:before{content:"";position:absolute;inset:0;background:var(--glow);opacity:.33;pointer-events:none;z-index:-2}.card:after{content:"";position:absolute;inset:5px;border-radius:22px;border:1px solid rgba(255,255,255,.55);pointer-events:none;z-index:4}.card-pattern{position:absolute;inset:0;z-index:-1;opacity:.16;background-size:cover;background-position:center;pointer-events:none}.hidden .card-pattern{opacity:.3}
/* v0.27: "노멀/레어는 됐는데 에픽/레전더리는 더 임팩트 있어야 하지 않냐"는
   피드백 -- 지금까지 등급 차이는 색상(--border/--glow/--scene)뿐이라 상위
   등급이라는 느낌이 약했음. 새 에셋 없이 이미 있는 rarity_symbols 아이콘 +
   순수 CSS 애니메이션으로 EPIC/LEGENDARY 전용 연출 추가 (NORMAL/RARE/HIDDEN은
   그대로 -- HIDDEN은 이미 전용 다크 테마로 차별화돼 있어서 대상에서 제외).
   `.card-emblem`은 등급 심볼(별/왕관)을 카드 우하단에 크게, 아주 옅게 깔아서
   "각인" 느낌, 빛 효과 연혁은 아래 참고 (v0.41부터 `.holo-canvas` --
   card()/createCardHolo()의 JS 주석 참고, 여기 CSS엔 위치 지정만 남음). */
.card-emblem{position:absolute;z-index:-1;right:-14px;bottom:-10px;width:130px;height:130px;object-fit:contain;opacity:.22;transform:rotate(-10deg);pointer-events:none;animation:emblemSpin 16s linear infinite}
@keyframes emblemSpin{from{transform:rotate(-10deg)}to{transform:rotate(350deg)}}
/* 빛 효과 연혁 (v0.28~v0.40은 카드 전체에 CSS로 스침 효과, v0.41에서 아트창
   전용 Canvas 홀로그램 효과로 전면 교체):
   v0.28: box-shadow/background-position 애니메이션 -- 매 프레임 리페인트라
   실기기에서 렉.
   v0.29: transform 기반 슬라이드 막대(자식 DIV 2개)로 교체 + 텍스트 컬럼을
   clip-path로 보호(스침이 카드 전체를 흰빛으로 덮어 문구가 안 보였던 문제).
   v0.36: 왕복(wiper) 운동 → 단방향 스침, 피크 밝기 하향.
   v0.38: `ease-in-out`의 느린 도입부 → `ease-out`, 스침 비율/주기 조정.
   v0.38(2차): "회전한 사각형 그라디언트 띠"로 보인다는 지적 -- 감독이
   프로토타입(card-shine.css)을 보내줘서 반영. 대각선 그라디언트를 카드
   전체 크기 의사요소(`::after`) 하나로 슬라이드+opacity 페이드.
   v0.39(2차): 그래도 "선"으로 보임 -- 그라디언트 전환 구간을 0~100%로
   넓혀서 좁은 띠 구조 자체를 제거.
   v0.40: 그래도 실기기에서 "하얀선이 지나간다"는 지적 -- 감독이 이번엔
   포켓몬 카드 CSS 프로젝트(poke-holo.simey.me)를 참고한 Canvas 2D
   프로토타입(card-holo.js)을 보내줌. CSS 그라디언트로는 결국 "카드
   전체를 가로지르는 띠"라는 형태를 벗어날 수 없었던 반면, 이 방식은
   효과를 아예 아트창(`.scene`) 안에만 가두고(카드 전체가 아님 -- 텍스트
   영역은 구조적으로 닿을 수 없음), 무지개 회절광+유리 클리어코트
   반사+고정된 반짝이 조각+테두리 rim light를 캔버스 픽셀 단위로 합성.
   원본은 이 화면 특정 스크린샷(380x326)에 맞춰 달빛/고양이 얼굴 위치를
   직접 좌표로 지정했지만, 실제 앱은 카드마다 다른 일러스트를 아트창
   크기(기기별로 다름)에 맞춰 쓰므로 그 부분은 일러스트 내용 기반(밝기)
   판정으로 일반화 -- createCardHolo() 자체 주석 참고. */
.epic{box-shadow:0 0 0 3px rgba(168,108,255,.55),0 16px 34px rgba(140,80,230,.4),var(--shadow)}
.legendary{box-shadow:0 0 0 3px rgba(224,164,40,.6),0 16px 34px rgba(224,164,40,.42),var(--shadow)}.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 9px}.rarity{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--border);color:var(--badgeText,#fff);font-size:11px;font-weight:1000;letter-spacing:.6px}.rarity-symbol{width:14px;height:14px;object-fit:contain;display:block}.case-id{font-size:11px;color:var(--muted);font-weight:800}.card-body{display:grid;grid-template-columns:1.25fr .85fr;gap:10px;padding:4px 14px 14px;align-items:center}.case-title{font-size:25px;font-weight:1000;letter-spacing:-1.2px;line-height:1.05}.detail{font-size:13px;line-height:1.55;color:#655B54;margin-top:7px}.punch{font-size:16px;font-weight:1000;margin:12px 0 0;line-height:1.4}.scene{min-height:132px;border-radius:21px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;background:var(--scene)}.scene img{width:112px;height:112px;object-fit:cover;border-radius:22px;margin-bottom:7px;filter:drop-shadow(0 7px 10px rgba(40,30,20,.12))}.scene-mark{position:absolute;right:8px;top:8px;font-size:22px}.meta-strip{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}.pill{background:rgba(255,255,255,.72);border:1px solid rgba(130,110,95,.16);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;color:#675D56}.share-row{display:flex;gap:8px;padding:0 14px 14px}.share{flex:1;border:1px solid rgba(120,100,80,.22);background:rgba(255,255,255,.78);border-radius:var(--btn-radius);min-height:var(--btn-min);padding:0 10px;font-weight:900;color:#5B5048;display:flex;align-items:center;justify-content:center}.share:active{transform:scale(.98)}
/* v0.35: compact one-line case rows below the featured card (home screen
   mockup match) -- --scene/--border are set per rarity class the same way
   .card's rarity classes already do (see :root/.normal/.rare/etc above). */
/* v0.49: 8px -> 10px, same "카드/버튼 사이 간격" pass as .stats/
   .settings-list below -- a touch more breathing room between stacked
   cards/rows, closer to what apps like 토스/카카오뱅크 use between list
   items (roughly 8-12px) than the tighter 8px this had across the board. */
.case-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.case-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--border,var(--line));border-radius:16px;padding:11px 13px;cursor:pointer}
.case-row-icon{font-size:20px;width:36px;height:36px;border-radius:12px;background:var(--scene,#F6F0E6);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.case-row-text{flex:1;min-width:0}
.case-row-text b{display:block;font-size:14px}
.case-row-text span{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-row .rarity{flex-shrink:0}
.normal{--border:var(--normal);--badgeText:#393939;--glow:linear-gradient(120deg,#fff,#ececec);--scene:linear-gradient(160deg,#f9f9f9,#ececec)}.rare{--border:var(--rare);--glow:linear-gradient(120deg,#C9EAFF,#F7FBFF);--scene:linear-gradient(160deg,#E8F6FF,#CDEAFF)}.epic{--border:var(--epic);--glow:linear-gradient(120deg,#E6D1FF,#FFDCFB);--scene:linear-gradient(160deg,#302557,#6C478F)}.legendary{--border:var(--legend);--badgeText:#5E4300;--glow:linear-gradient(120deg,#FFE697,#FFF6C7);--scene:radial-gradient(circle at 50% 28%,#FFF9C6,#F2C43E 65%,#B47913)}
.hidden{--border:#0AB6D4;--glow:linear-gradient(135deg,#031923,#0A4C67);--scene:radial-gradient(circle at 50% 30%,#104F68,#061A26 75%);background:#071C29;color:#E9FBFF;box-shadow:0 16px 38px rgba(0,31,45,.28)}.hidden.opal{--border:#DDE8FF;--badgeText:#342D46;--glow:linear-gradient(135deg,#FFE9F7,#DFF8FF,#EEE0FF,#FFF6C6);--scene:linear-gradient(145deg,#271E57,#453A84 45%,#B963B6);background:#FBF8FF;color:#342D46}.hidden .detail,.hidden .case-id{color:#B9DFE8}.hidden.opal .detail,.hidden.opal .case-id{color:#675E7E}.hidden .share{color:#E9FBFF;border-color:#23647A;background:#0A2938}.hidden.opal .share{color:#4B4161;background:rgba(255,255,255,.76);border-color:#D8CDE8}
.featured{transform:translateZ(0)}.featured .card-body{grid-template-columns:1fr 1fr}.featured .scene{min-height:155px}.featured .scene img{width:135px;height:135px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 14px rgba(70,50,35,.04)}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}
.archive-progress{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.bar{height:9px;background:#EEE6DC;border-radius:99px;overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7ABEFF,#A56CFF,#FFD166);border-radius:99px}.archive-item{background:white;border:1px solid var(--line);border-radius:18px;padding:14px 15px;margin:8px 0}.archive-top{display:flex;justify-content:space-between;align-items:center}.archive-name{font-weight:900}.rarity-dots{display:flex;gap:5px;margin-top:9px}.dot{width:25px;height:8px;border-radius:10px;background:#ECE5DD}.dot.on.n{background:var(--normal)}.dot.on.r{background:var(--rare)}.dot.on.e{background:var(--epic)}.dot.on.l{background:var(--legend)}.locked{opacity:.48}.hidden-line{background:linear-gradient(90deg,#071C29,#143D51);color:#E9FBFF;border-color:#19536C}.hidden-line .dot{background:#235164}
.record-list{margin-top:12px}.record-app{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid #E8DED3}.record-app b{font-size:13px}.record-app span{font-size:12px;color:var(--muted)}
/* v0.47: "최근 7일" recap bars (records()/weekRecap()) -- a single-hue
   sparkline reusing .primary's own purple, not a new palette. .empty
   (no stored entry for that day) is greyed to `--line` so a genuinely
   quiet day and "no data yet" never look the same at a glance. */
.week-recap{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 10px 10px;margin-top:2px}
.week-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.week-bar-col span{font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap}
.week-bar{width:100%;max-width:22px;border-radius:6px 6px 3px 3px;background:#6758F5;opacity:.5}
.week-bar.today{opacity:1}
.week-bar.empty{background:var(--line);opacity:1}
.settings-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.settings-row{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer}
.settings-row.static{cursor:default}
/* v0.43: director feedback -- "many buttons in settings don't respond when
   tapped." Root cause is app-wide, not settings-specific: `*` disables
   `-webkit-tap-highlight-color` globally (see that rule's own comment above)
   and most tap targets had no `:active` state of their own to replace it
   with, so a tap gave zero visual feedback until the next full render
   landed -- reads as broken even when the onclick handler ran fine. `.share`
   already had this fix (`.share:active` above); extend the same instant
   press feedback to every other primary tap target. */
.settings-row:active,.case-row:active,.archive-card:active,.card:active,.icon-btn:active,.primary:active,.tabbtn:active,.sheet-close:active,.sheet-actions button:active{transform:scale(.97)}
.settings-row img{width:26px;height:26px;object-fit:contain;flex-shrink:0}
.settings-emoji{font-size:22px;width:26px;text-align:center;flex-shrink:0}
.settings-row-text{flex:1;min-width:0}
.settings-row-text b{display:block;font-size:14px}
.settings-row-text span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.settings-chevron{color:var(--muted);font-size:20px}
.modal{position:fixed;inset:0;background:rgba(32,25,21,.55);display:flex;align-items:flex-end;justify-content:center;padding:18px 18px calc(18px + env(safe-area-inset-bottom));z-index:30}
/* v0.38: director feedback -- opening a modal didn't reliably fit on one
   screen; when its content overflowed, `overflow:auto` scrolled the WHOLE
   sheet (handle, title AND the close button together), so a long enough
   content list (or just a short screen) could scroll `.sheet-close` itself
   out of view, needing an extra scroll just to find how to close it. Split
   `.sheet` into a fixed header/footer (handle + close button, never
   scroll) and a `.sheet-scroll` middle region that scrolls on its own when
   content doesn't fit -- the close button (and handle) are now always
   visible without scrolling, regardless of content length. */
.sheet{max-width:720px;width:100%;background:var(--bg);border-radius:30px 30px 18px 18px;padding:15px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -16px 60px rgba(0,0,0,.25)}.sheet-scroll{overflow:auto;min-height:0}.sheet-handle{width:44px;height:5px;border-radius:99px;background:#CDBFB4;margin:0 auto 11px;flex-shrink:0}.sheet-close{width:100%;border:0;background:#E9DED1;min-height:var(--btn-min);padding:0 12px;border-radius:var(--btn-radius);font-weight:900;margin-top:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.detail-title{font-size:13px;color:var(--muted);text-align:center;margin:2px 0 10px}
/* v0.43: two-button footer for the "데이터 초기화" confirmation sheet
   (openResetConfirm()) -- same fixed-footer-never-scrolls layout as
   .sheet-close, just split into a cancel + destructive-confirm pair. */
.sheet-actions{display:flex;gap:8px;margin-top:9px;flex-shrink:0}.sheet-actions button{flex:1;border:0;min-height:var(--btn-min);padding:0 12px;border-radius:var(--btn-radius);font-weight:900;display:flex;align-items:center;justify-content:center}.sheet-actions .cancel{background:#E9DED1;color:var(--ink)}.sheet-actions .danger{background:#E0574A;color:#fff}
/* v0.44: non-destructive confirm (exit-app), same weight as .primary's
   purple rather than .danger's red -- leaving the app loses nothing, so it
   shouldn't read as alarming as a data-reset confirmation does. */
.sheet-actions .confirm{background:#6758F5;color:#fff}
/* v0.53: director feedback -- (1) the Pocket-style interactive holofoil
   effect (createCardHolo()/mountHolo()) belonged on the "card screen" you
   get when TAPPING an incident, not on the home screen's small featured
   card where v0.52 had put it; (2) this detail page's white-background/
   differently-colored-middle-layer look was "별로" (not good) -- it
   should instead feel like the share card (ShareCardRenderer.kt/
   CardStyle.kt's bordered TCG-card look), with the Pocket effect layered
   on top of THAT. Full redesign: a bordered "TCG card" component reusing
   the exact same frame_bg/medallion webp assets and per-rarity palette
   CardStyle.kt defines natively (see tcgPalette()/foilTitleStyle(), which
   mirror CardStyle.kt's Kotlin tables 1:1), with the interactive holo
   canvas moved onto that card's own art window (tcg-art) instead of
   .scene. The old "force this page back to light bg regardless of rarity
   class" override is gone -- see detailPage()'s --page-* custom
   properties (set inline per rarity, read by .detail-case-id/.detail-sub/
   .detail-stats below) for how text/panel colors now adapt instead.
   v0.54: two more rounds of feedback on this v0.53 redesign itself --
   (a) "카드 자체가 움직이지는 않네" (the card itself doesn't move) -- see
   mountHolo()'s v0.54 comment for the added 3D tilt. (b) "배경도 검은
   배경이네;; 그냥 저 고양이발바닥 무늬 배경으로 하지" (the backdrop's
   dark too -- just use that paw-print background) -- detailPage() now
   points .detail-backdrop at cardPatternBg(i), the exact same light warm
   paw-print texture the home card's own .card-pattern already uses
   (HIDDEN's own variant of that asset is already a moody dark scene on
   its own, so this one swap handles both moods with no rarity branching
   needed here). (c) "스크롤 되네? 어떻게든 한 화면에 담아주지" (it still
   scrolls, fit it on one screen) -- this page is now a fixed-height,
   non-scrolling flex column (see .app.detail-mode) and the card's actual
   size is fit to whatever vertical space is left over by JS
   (fitTcgCard(), called alongside mountHolo()) rather than a fixed
   max-width, so it shrinks instead of overflowing on a short screen. */
.detail-page{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;padding:calc(10px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;background:transparent !important;color:var(--page-text,var(--ink)) !important;box-shadow:none !important}
/* v0.50: director feedback -- the incident detail page "still scrolls"
   even though its own content clearly fits on screen with room to spare.
   Root cause found by measuring actual computed heights: `.app`'s base
   rule reserves `calc(90px + env(safe-area-inset-bottom))` of
   padding-bottom for the bottom tab bar (tabs() is fixed-positioned, so
   that space has to be reserved so content doesn't render underneath it)
   -- but `root.className='app detail-mode'` (render()'s state.detailItem
   branch) never rendered tabs() at all, and `.detail-page` right inside
   it already carries its own appropriate bottom padding. The two stacked
   (90px+ from .app, unused here, plus .detail-page's own) pushed total
   page height past the viewport on a real device with less usable height
   than this was tested against (status bar + 3-button/gesture nav chrome
   eating into it) -- v0.48's overscroll fix addressed a real but
   different problem (the bounce/glow effect on short content) and didn't
   touch this actual height overflow at all. Zero out the inherited
   padding specifically for detail mode.
   v0.54: that fix zeroed out one stacked source of overflow, but the page
   could still end up taller than the viewport depending on content (card
   height + stat row count) and scroll anyway -- "스크롤 되네? 어떻게든
   한 화면에 담아주지" (it still scrolls, fit it on one screen somehow).
   This is now a hard height:100dvh (100vh fallback for older WebView)
   box with overflow:hidden, and .detail-page's flex children share that
   fixed budget instead of the page just growing past it -- see
   fitTcgCard(). */
/* isolation:isolate: v0.53's dark #0A0A0C background on this element used
   to mask over body's own cream background wherever .app sits, so
   .detail-backdrop's position:fixed;z-index:-2 image always had SOME
   equally-dark surface right behind it. Once that background was dropped
   (v0.54 -- see .detail-backdrop's own comment) nothing masked body's
   background anymore, and the backdrop's negative z-index, with no
   stacking context between it and the document root, sank BELOW body's
   own (unpositioned, so normal-flow-layer) background instead of behind
   just .detail-page -- verified via Playwright that the backdrop image
   loads fine but paints fully hidden under body's cream fill regardless.
   isolation:isolate makes this element its own stacking context, so
   .detail-backdrop's z-index is scoped locally against .detail-page (its
   actual intent) instead of racing body's background at the document root. */
.app.detail-mode{padding-bottom:0;height:100vh;height:100dvh;overflow:hidden;isolation:isolate}
/* v0.53: fixed full-bleed backdrop behind the whole detail page -- a
   sibling of .detail-page rather than its background-image, so it covers
   the true viewport (including under the status bar) regardless of
   .detail-page's own max-width/padding box.
   v0.54: was the dark backgrounds/share/1080x1920/bg_<rarity>_vertical.png art +
   a heavy black scrim (director: "배경도 검은 배경이네" -- the backdrop's
   dark too) -- detailPage() now points this at cardPatternBg(i) instead
   (see this file's other v0.54 comments), which is light/warm on its own
   for every rarity but HIDDEN, so the scrim is gone too. */
.detail-backdrop{position:fixed;inset:0;z-index:-2;background-color:var(--bg);background-size:cover;background-position:center}
.detail-page-head{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:var(--btn-radius);width:var(--btn-min);height:var(--btn-min);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn img{width:19px;height:19px;object-fit:contain}
/* v0.53: tried recoloring .icon-btn for this page's dark backdrop (a
   translucent dark chip + brightness(0) invert(1) on the glyph) but
   icon_back.png/icon_share.png are two-tone assets (a near-white circle
   fill with a black glyph cut into it, not a single-color glyph on
   transparent) -- brightness(0) crushes both tones to black and invert(1)
   then turns both to identical white, erasing the glyph into a flat white
   dot. The plain white .icon-btn (unchanged from every other page) reads
   fine floating over a dark backdrop as-is -- no override needed. */
.detail-case-id{font-size:12px;color:var(--page-muted,var(--muted));font-weight:800;text-align:center;flex:0 0 auto;margin-top:6px}
.detail-sub{font-size:12px;color:var(--page-text,var(--ink));opacity:.85;line-height:1.4;margin-top:3px;text-align:center;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* v0.53: the "TCG card" component -- a bordered frame (frame_bg/<rarity>.webp,
   the same texture ShareCardRenderer.kt draws the share PNG's frame from)
   sized to the same 1024x1536 aspect ratio as CardLayout's native canvas,
   so the header/art/info/emblem rects below (CardLayout's own pixel rects
   converted from 1024x1536 to %) line up with the frame art exactly like
   they do in the Kotlin renderer.
   v0.54: .tcg-card-wrap is now the flexible middle of the page's flex
   column (flex:1;min-height:0) instead of a fixed max-width block --
   fitTcgCard() measures its actual box every render and shrinks
   .tcg-card's width to whatever keeps the aspect ratio inside it, so a
   short screen shrinks the card instead of scrolling past it. `perspective`
   here (not on .tcg-card itself) is what gives the card's own rotateX/
   rotateY tilt (see mountHolo()) real depth instead of a flat skew. */
/* flex-basis:0 (the `1` shorthand), not `auto` -- with `auto` this wrap's
   hypothetical main size is its own content's height, which is .tcg-card's
   aspect-ratio-driven height, which depends on .tcg-card's WIDTH, which is
   100% of this wrap -- a circular dependency that (verified via
   Playwright) converges to a self-consistent but badly wrong tiny size
   instead of "however much space is actually left". flex-basis:0 makes
   this wrap's height purely "whatever's left in .detail-page after the
   flex:0 0 auto siblings", with no dependency on its own child's size at
   all, which is what fitTcgCard() actually needs to measure correctly. */
.tcg-card-wrap{flex:1;min-height:0;margin-top:10px;display:flex;align-items:center;justify-content:center;perspective:900px}
.tcg-card{position:relative;width:100%;max-width:360px;aspect-ratio:1024/1536;border-radius:26px;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 22px 55px rgba(0,0,0,.4),0 0 0 2px var(--tcg-border,rgba(255,255,255,.3));transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,1,.36,1);will-change:transform}
/* v0.54: director feedback -- "카드 자체가 움직이지는 않네" (the card
   itself doesn't move). Dragging the art window already fed the holo
   canvas's light position; mountHolo() now also tilts .tcg-card itself in
   3D (rotateX/rotateY) from that same drag position for the actual
   "holding a physical card" Pocket motion, not just its light shifting in
   place. .tilting drops the transition above while actively dragging so
   the tilt tracks the finger with no lag; removing it on release lets the
   base transition ease the card back flat. */
.tcg-card.tilting{transition:none}
.tcg-header{position:absolute;left:9.5%;top:13%;width:81%;height:7.1%;display:flex;align-items:center;padding:0 4%;border-radius:10px;background:var(--tcg-panel,#fff)}
.tcg-title{font-size:clamp(13px,4.2vw,19px);font-weight:1000;letter-spacing:-.6px;color:var(--tcg-text,#2F2A27);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
/* v0.53: EPIC/LEGENDARY/HIDDEN titles get the same foil-gradient text
   treatment CardStyle.kt's FoilTitleStyle draws natively (a gradient fill
   + outline + soft glow) -- foilTitleStyle() below supplies the 3 CSS
   custom properties this reads. */
.tcg-title.foil{background-image:linear-gradient(180deg,var(--foil-colors));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.4px var(--foil-outline,transparent);filter:drop-shadow(0 0 5px var(--foil-glow,transparent))}
.tcg-art{position:absolute;left:10%;top:20.5%;width:80%;height:40.4%;border-radius:16px;overflow:hidden;background-size:cover;background-position:center}
.tcg-emblem{position:absolute;left:50%;top:8.1%;width:15.8%;aspect-ratio:1/1;transform:translate(-50%,-50%);background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));pointer-events:none}
.tcg-info{position:absolute;left:9.5%;top:72.7%;width:81%;height:17.5%;border-radius:14px;background:var(--tcg-panel,#fff);color:var(--tcg-text,#2F2A27);padding:9px 12px;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:5px}
.tcg-punch{font-size:13px;font-weight:1000;line-height:1.32}
.tcg-chip{font-size:10px;font-weight:800;color:var(--tcg-chip,#675D56);opacity:.85}
.detail-stats{background:var(--page-panel,rgba(255,255,255,.78));border:1px solid var(--page-panel-line,var(--line));border-radius:16px;padding:10px 14px;margin-top:10px;color:var(--page-text,var(--ink));flex:0 0 auto;max-height:96px;overflow:auto}
.detail-stats>b{font-size:12px;display:block;margin-bottom:4px}
.detail-stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--page-stat-line,#EFE7DB)}
.detail-stat-row:first-of-type{border-top:0}
.detail-stat-row span{font-size:11px;color:var(--page-muted,var(--muted))}
.detail-stat-row b{font-size:13px;font-weight:900}
.detail-share-btn{margin-top:10px;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2F2926;color:white;border-radius:999px;padding:10px 15px;font-size:12px;font-weight:800;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.foot{font-size:10px;text-align:center;color:#A4978E;margin-top:28px;letter-spacing:.7px}
@media(max-width:430px){.app{padding-left:16px;padding-right:16px}.brand h1{font-size:27px}.avatar{width:60px;height:60px}.card-body{grid-template-columns:1.22fr .78fr}.case-title{font-size:22px}.scene{min-height:118px}.scene img{width:98px;height:98px}.daily-strip{gap:6px}.mini-stat{padding:9px 4px}}

/* v0.4 asset integration */
.brand-logo{height:46px;max-width:220px;object-fit:contain;object-position:left center;display:block}
.avatar{background:#8FB8F8;border:none;object-fit:cover}
.hero{background-image:linear-gradient(90deg,rgba(255,249,240,.88),rgba(255,249,240,.58)),url('visual/backgrounds/bg_room_day.png');background-size:cover;background-position:center}
.hero .hero-moni{width:120px;height:108px;object-fit:contain;border-radius:0;background:transparent}
.scene{background-size:cover!important;background-position:center!important}
/* v0.41: EPIC/LEGENDARY holofoil canvas overlay -- see createCardHolo() JS
   comment for the full story.
   v0.53: mounts inside detailPage()'s .tcg-card now, not the home card's
   .scene (see card()/mountHolo()'s own v0.53 comments) -- this rule needs
   no change either way since it only cares about its own box.
   v0.59: was confined to .tcg-art (inset:0 relative to that box); now a
   direct child of .tcg-card itself, so the same inset:0 covers the WHOLE
   card instead -- director feedback that the tilt/shimmer should engage
   over the entire card, not just the art window. createCardHolo() no
   longer redraws the card's real content into the canvas at all (it can't
   -- the canvas now spans the frame art/header/art/info/medallion
   together, not one photo it could copy), so `mix-blend-mode:screen`
   blends its shimmer-only, otherwise-transparent pixels with whatever
   real card content sits behind it -- a plain photo/reduced-motion
   fallback needs no special-casing here since it's just whatever's
   already underneath, unchanged, when this canvas draws nothing at all. */
.holo-canvas{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;mix-blend-mode:screen}
.scene .moni-asset{width:118px;height:118px;object-fit:contain;border-radius:0;margin-bottom:4px;filter:drop-shadow(0 7px 10px rgba(40,30,20,.14));position:relative;z-index:1}
/* v0.23: incident illustration pack (docs/UI_VISUAL_DIRECTION_REQUEST.md).
   'scene' render_mode incidents are a full illustrated background (no
   separate MONI overlay drawn on top -- see incidentVisual()/card()), so
   the decorative emoji corner mark is hidden there to avoid cluttering a
   finished illustration; 'overlay' mode keeps it, same as before. */
.scene.scene-illustrated .scene-mark{display:none}
.empty{display:flex;align-items:center;gap:14px;text-align:left}
.empty img{width:74px;height:74px;object-fit:contain;flex:none}
.empty p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
/* Deliberately NOT using cards/frames/*.png (or templates/examples) as the
   `.card` background: this element's height is content-driven (title
   length, detail text, share buttons all vary), but the frame art has a
   fixed ~0.8 aspect ratio. `contain` only filled a band at the top of
   tall cards, `cover` cropped the border art -- both looked broken/
   half-finished on real devices. The original flat-color + `.card:before`
   glow-gradient system below (driven by the `.normal/.rare/.epic/
   .legendary/.hidden[.opal]` classes' custom properties) has no aspect
   constraint and already looked right, so `.card` just falls back to it.
   Frame art is used where a fixed-aspect box is actually controlled:
   ShareCardRenderer.kt's native share cards. */
.archive-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.archive-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;min-height:220px;box-shadow:0 5px 16px rgba(70,50,35,.06);position:relative;overflow:hidden}.archive-visual{width:100%;height:165px;border-radius:13px;background:var(--scene,#F6F0E6);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.archive-visual img{width:76%;height:88%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(40,30,20,.12))}
/* v0.30: "overlay" 타입 일러스트(1200x675 투명 배경, 실제로 그려진
   내용은 캔버스 가운데 작은 영역뿐 -- ShareCardRenderer.kt의
   opaqueBounds() 코멘트와 같은 문제)를 기존처럼 `contain`으로 그대로
   두면 캔버스 전체(투명 여백 포함)를 기준으로 축소돼서 캐릭터가 실제보다
   훨씬 작게 나옴. 웹뷰에서는 Kotlin처럼 픽셀 단위로 알파 바운딩박스를
   구해 잘라내기 번거로워서, 대신 `cover`로 바꿔 이미지를 확대한 뒤
   중앙(대부분 캐릭터가 있는 자리) 기준으로 crop -- 여백이 크게 줄고
   캐릭터가 타일을 훨씬 더 채우게 됨. 잠금 카드(`locked_card.png`)는
   카드 전체가 유의미한 그림이라 그대로 `contain` 유지. */
.archive-visual .overlay-fill{object-fit:cover}.archive-card b{font-size:13px;display:block;margin-top:7px}.archive-card span{font-size:11px;color:var(--muted)}.archive-card.locked .archive-visual{filter:grayscale(1) brightness(.7);opacity:.7}.archive-card.locked:after{content:'???';position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:1000;color:white;background:rgba(8,22,31,.15)}.archive-card:not(.locked){cursor:pointer}
/* v0.33: archive card detail modal (openArchiveDetail()) -- a 2x2 grid of
   per-rarity thumbnails for regular types, or a single hero image for
   HIDDEN types (they have no rarity breakdown to show). */
.archive-detail-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 12px}.archive-detail-head b{font-size:17px}.archive-detail-head span{font-size:11px;color:var(--muted)}
.rarity-cell-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rarity-cell{border:2px solid var(--line);border-radius:16px;padding:8px;text-align:center;background:#fff}
.rarity-cell.normal{border-color:var(--normal)}.rarity-cell.rare{border-color:var(--rare)}.rarity-cell.epic{border-color:var(--epic)}.rarity-cell.legendary{border-color:var(--legend)}
.rarity-cell.locked{border-color:var(--line);opacity:.55}
.rarity-cell-visual{width:100%;height:120px;border-radius:12px;background:#F3EEE6 center/cover no-repeat;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.rarity-cell-visual span{font-size:26px;color:var(--muted);font-weight:1000}
.rarity-cell>span{font-size:11px;font-weight:900;display:block}
.archive-detail-hero{text-align:center;padding:2px}
.archive-detail-hero img{width:100%;border-radius:16px;margin-bottom:10px}
.archive-detail-hero b{font-size:16px;display:block}
.archive-detail-hero>span{font-size:12px;color:var(--muted);display:block;margin-top:4px}
.record-decor{background:linear-gradient(90deg,rgba(255,249,240,.92),rgba(255,249,240,.72)),url('visual/backgrounds/bg_room_night.png') center/cover;border-radius:22px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:14px;color:var(--ink)}.record-decor img{width:82px;height:82px;object-fit:contain}.record-decor b{font-size:18px}.record-decor p{font-size:11px;margin:4px 0 0;color:var(--muted)}
</style>

<body><main class="app" id="app"></main><div id="overlay"></div>
<script>
const N=window.OpenedAgainNative;
// v0.43: single source of truth for the version string shown in the "앱
// 정보" settings row and its detail sheet -- still has to be kept in sync
// with app/build.gradle.kts's versionName by hand (no bridge call exposes
// it to JS, see settings()'s own longstanding comment), but at least isn't
// duplicated a second time within this file anymore.
const APP_VERSION='0.59.0';
const params=new URLSearchParams(location.search);const preview=params.get('preview')==='1';
// v0.24: `?onboarding=0` forces the onboarding gate off regardless of
// state.settings.onboardingSeen -- an escape hatch for screenshotting/
// testing the rest of the app without clicking through onboarding every
// time (default behavior, incl. under `preview=1`, is unchanged: onboarding
// still gates a first-ever launch).
const skipOnboarding=params.get('onboarding')==='0';
// English strings exist throughout via l(ko, ja, en) but are not exposed yet —

// v0.47: director-approved feature add -- state.history.days has been
// silently accumulating one entry per day (via persistSnapshot(), since
// v0.35) but nothing ever read it back; records() only ever showed
// *today's* numbers. Reads the last 7 calendar days (today included) out
// of that same store and shows a small bar-per-day recap so days' worth
// of data already being collected/persisted isn't wasted. A day with no
// stored entry (not used yet, or before this device's history started)
// renders as an empty/greyed bar rather than a 0-height one, so "no data"
// stays visually distinct from "genuinely zero incidents that day."
function weekRecap(){
  const days=[];
  for(let i=6;i>=0;i--){
    const dt=new Date();dt.setDate(dt.getDate()-i);
    const key=dt.toISOString().slice(0,10);
    const entry=state.history.days[key];
    days.push({label:`${dt.getMonth()+1}/${dt.getDate()}`,count:entry?entry.report.totalIncidents:null,isToday:i===0});
  }
  const max=Math.max(1,...days.map(x=>x.count||0));
  const total=days.reduce((a,x)=>a+(x.count||0),0);
  const bars=days.map(x=>{
    const known=x.count!==null;
    const h=known?Math.max(6,Math.round((x.count/max)*44)):4;
    return `<div class="week-bar-col"><div class="week-bar${known?'':' empty'}${x.isToday?' today':''}" style="height:${h}px" title="${known?x.count:'-'}"></div><span>${x.label}</span></div>`;
  }).join('');
  return `<div class="section-title"><h2>${l('최근 7일','過去7日間','Last 7 days')}</h2><span class="count">${l(`총 ${total}건`,`計${total}件`,`${total} total`)}</span></div><div class="week-recap">${bars}</div>`;
}

// their CSS) with .tcg-card-wrap as the flexible middle -- this measures
// that wrap's actual laid-out box (after header/case-id/sub/stats/button
// have all taken their own space) and shrinks .tcg-card's width to
// whatever keeps its 1024:1536 aspect ratio inside what's left, instead
// of the fixed 360px cap that could make the card (and so the whole page)
// taller than a short screen. Only ever shrinks -- resets to the CSS
// max-width first so a taller/roomier screen still gets the full-size
// card back on the next render (e.g. after an orientation change).
function fitTcgCard(){

  const card=document.querySelector('.tcg-card');
  if(!wrap||!card)return;

  if(!availH)return;
  const naturalH=card.getBoundingClientRect().height;
  if(naturalH>availH)card.style.width=Math.max(140,Math.floor(availH*1024/1536))+'px';

  // the home screen's featured card (see this file's other v0.53 comments).
  if(state.detailItem){root.className='app detail-mode';root.innerHTML=detailPage(state.detailItem);fitTcgCard();mountHolo();return}
  root.className='app';let html=header();

  const d=state.data||read();state.data=d;if(!d.permission){html+=`<div class="permission"><h2>${l('모니가 사건을 조사하려면','MONIが事件を調べるには','To let MONI investigate')}</h2><p>${l('앱 사용 기록을 기기 안에서 분석하기 위한 사용정보 접근 권한이 필요합니다. 기록 내용은 서버로 보내지 않습니다.','端末内でアプリ利用記録を分析するため、使用状況へのアクセスが必要です。記録内容はサーバーへ送信しません。','Usage access is required to analyze app activity on-device. Your records are not sent to a server.')}</p><button class="primary" onclick="N&&N.openUsageSettings()">${l('사용정보 접근 허용','使用状況へのアクセスを許可','Allow usage access')}</button></div>`;html+=tabs();root.innerHTML=html;return}html+=state.tab==='cases'?cases(d):state.tab==='archive'?archive(d):records(d);html+=`<div class="foot">MONI · SMALL HABITS, BIG STORIES.</div>`;html+=tabs();root.innerHTML=html}
